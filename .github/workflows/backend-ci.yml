name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EducationPlatform.slnx
      - name: Build
        run: dotnet build EducationPlatform.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test EducationPlatform.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
